version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: auditor-acessos:latest
    container_name: auditor-acessos
    env_file:
      - .env
    environment:
      # Sobrescreve/complementa o .env; útil para gerar um execution_id único por execução
      - EXECUTION_ID=${EXECUTION_ID:-local-dev}
      - BOT_ID=${BOT_ID:-auditor001}
    volumes:
      # Persistência dos logs no host
      - ./logs:/app/logs
      # (Opcional) útil se precisar montar dados/DataPool locais durante testes
      # - ./data:/app/data
    restart: "no"
