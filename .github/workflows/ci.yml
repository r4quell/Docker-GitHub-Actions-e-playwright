name: CI - Auditor de Acessos

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar browsers do Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe do projeto (compileall)
        run: |
          python -m compileall -q .

      - name: Executar testes (pytest, se existirem)
        run: |
          if [ -d "tests" ] || compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pip install pytest
            pytest -v
          else
            echo "Nenhum teste encontrado. Etapa de validação por compileall já executada."
          fi

      - name: Build da imagem Docker
        run: |
          docker build -t auditor-acessos:ci .
